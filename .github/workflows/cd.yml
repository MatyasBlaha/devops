name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-staging:
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Create k3d cluster
        run: k3d cluster create staging --wait

      - name: Build and import Docker image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${{ github.event.workflow_run.head_sha || github.sha }}"
          docker build -t "$IMAGE" .
          k3d image import "$IMAGE" -c staging
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Write staging secrets from GitHub Secrets
        env:
          STAGING_DB_USER: ${{ secrets.STAGING_DB_USER }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          cat > k8s/staging/secrets.env <<EOF
          POSTGRES_USER=${STAGING_DB_USER:-postgres}
          POSTGRES_PASSWORD=${STAGING_DB_PASSWORD:-postgres}
          EOF

      - name: Deploy to staging
        run: |
          cd k8s/staging
          kustomize edit set image "car-rental-app:latest=$IMAGE"
          cd ../..
          kubectl apply -k k8s/staging
          kubectl rollout status deployment/car-rental-app -n car-rental-staging --timeout=120s

      - name: Smoke test
        run: |
          kubectl port-forward svc/car-rental-app 3000:3000 -n car-rental-staging &
          sleep 5
          curl -sf --retry 3 --retry-delay 5 http://localhost:3000/health
          echo "Staging smoke test passed!"

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Create k3d cluster
        run: k3d cluster create production --wait

      - name: Build and import Docker image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          k3d image import "$IMAGE" -c production
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Write production secrets from GitHub Secrets
        env:
          PRODUCTION_DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: |
          cat > k8s/production/secrets.env <<EOF
          POSTGRES_USER=${PRODUCTION_DB_USER:-postgres}
          POSTGRES_PASSWORD=${PRODUCTION_DB_PASSWORD:-postgres}
          EOF

      - name: Deploy to production
        run: |
          cd k8s/production
          kustomize edit set image "car-rental-app:latest=$IMAGE"
          cd ../..
          kubectl apply -k k8s/production
          kubectl rollout status deployment/car-rental-app -n car-rental-production --timeout=120s

      - name: Smoke test
        run: |
          kubectl port-forward svc/car-rental-app 3000:3000 -n car-rental-production &
          sleep 5
          curl -sf --retry 3 --retry-delay 5 http://localhost:3000/health
          echo "Production smoke test passed!"
