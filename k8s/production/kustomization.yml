apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: car-rental-production

resources:
  - namespace.yml
  - ../base

patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: car-rental-app
      spec:
        replicas: 2
        template:
          spec:
            containers:
              - name: car-rental-app
                resources:
                  requests:
                    cpu: 200m
                    memory: 256Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
                env:
                  - name: LOG_LEVEL
                    value: info

  - target:
      kind: Ingress
      name: car-rental-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: car-rental.local

secretGenerator:
  - name: db-secret
    behavior: replace
    envs:
      - secrets.env
