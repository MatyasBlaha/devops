apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: car-rental-staging

resources:
  - namespace.yml
  - ../base

patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: car-rental-app
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: car-rental-app
                env:
                  - name: LOG_LEVEL
                    value: debug

  - target:
      kind: Ingress
      name: car-rental-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: staging.car-rental.local

secretGenerator:
  - name: db-secret
    behavior: replace
    envs:
      - secrets.env
