apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: car-rental-staging

resources:
  - namespace.yml
  - ../base

patches:
  - target:
      kind: Deployment
      name: car-rental-app
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LOG_LEVEL
          value: debug

  - target:
      kind: Ingress
      name: car-rental-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: staging.car-rental.local

secretGenerator:
  - name: db-secret
    behavior: replace
    literals:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres-staging
